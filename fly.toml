# Fly.io config. The app name is chosen at launch: fly launch --copy-config --name <your-name>
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # Rooms live in memory, so run exactly one machine. It sleeps when nobody is
  # connected and wakes on the next visit; open sockets keep it awake during play.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
