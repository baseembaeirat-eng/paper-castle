<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قلعة الورق — الشاشة الرئيسية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#2a241f;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  /* 16:9 stage, letterboxed on any other screen shape */
  canvas{width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));display:block;cursor:pointer;box-shadow:0 0 60px rgba(0,0,0,.6)}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(42,36,31,.82);z-index:5;font-family:'Cairo','Tajawal','Segoe UI',Tahoma,sans-serif;color:#f3ead6;text-align:center}
  #start button{font:inherit;font-size:44px;font-weight:800;color:#2b2622;background:#c59a4a;border:4px solid #2b2622;border-radius:255px 18px 225px 18px/18px 225px 18px 255px;padding:22px 60px;cursor:pointer;box-shadow:4px 6px 0 rgba(0,0,0,.45)}
  #start button:active{transform:translate(3px,5px);box-shadow:none}
  #start p{font-size:22px;margin:0;opacity:.85}
</style>
</head>
<body>
<div id="start"><button type="button">▶ ابدأ اللعبة</button><p>اضغط لتشغيل الصوت والموسيقى · M للكتم · F لملء الشاشة</p></div>
<canvas dir="ltr" id="stage" width="1600" height="900"></canvas>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/art.js"></script>
<script src="/js/sfx.js"></script>
<script src="/js/scenes.js"></script>
<script src="/js/host.js"></script>
</body>
</html>
